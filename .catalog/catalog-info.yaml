apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: tektoncd-tools-kustomize
  title: Tektoncd Tools - kustomize
  description: kustomize 是 Kubernetes 原生配置管理工具，在 Tekton 任务镜像中用于模板化和定制化 Kubernetes 资源，支持 GitOps 风格的部署流程。
  tags:
    - tool
    - kubernetes
    - gitops
    - open-source-fork
  links:
    - url: https://github.com/AlaudaDevops/kustomize
      title: GitHub Repository
      icon: github
    - url: https://build-sonar.alauda.cn/dashboard?id=github.com-AlaudaDevops-kustomize
      title: SonarQube
      icon: dashboard
    - url: https://github.com/kubernetes-sigs/kustomize
      title: Upstream Repository
      icon: github
  annotations:
    # github plugin
    github.com/project-slug: AlaudaDevops/kustomize
    # sonarqube plugin
    sonarqube.org/project-key: github.com-AlaudaDevops-kustomize
    # 开源组件代码仓库地址，格式：${url}/${project}/${repo}
    acp.cpaas.io/open-source-component-repo: https://github.com/kubernetes-sigs/kustomize
    # 开源组件的版本信息，只适用于开源组件，自研组件默认不收集版本信息,格式 ${version}
    acp.cpaas.io/open-source-component-version: v5.8.1
    # 开源组件的license信息,格式 ${license}
    acp.cpaas.io/open-source-component-license: Apache
    # 开源组件的license地址,格式 ${url}/${project}/${repo}/${license-path}
    acp.cpaas.io/open-source-component-license_url: https://github.com/kubernetes-sigs/kustomize/blob/master/LICENSE
    # backstage techdocs plugin
    backstage.io/techdocs-ref: dir:../
    acp.cpaas.io/owner: qingliu@alauda.io

    # 组件属性，区别是否部署时必带的核心组件,可选值为 core 和 plugin。
    acp.cpaas.io/functional-attributes: plugin

spec:
  type: service
  system: system:alauda-devops-system
  lifecycle: production
  owner: devops
